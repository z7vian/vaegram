name: bench-ab

on: [push]

jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: git worktree add ../base origin/ci/w4-P2-base
      - run: cargo bench --bench session --no-run
      - run: cargo bench --bench session --no-run
        working-directory: ../base
      - name: alternate base and candidate
        run: |
          # The push stage of this bench sometimes loses a few pushes and stops the run before the transfer rows;
          # such a run is tried again.
          rows() {
            for attempt in 1 2 3 4; do
              out=$( (cd "$1" && cargo bench --bench session 2>/dev/null) | grep -E 'cpu_ms_per_mib_download"|rss_after' )
              if [ -n "$out" ]; then echo "$out" | sed "s/^/$2 $3 /"; return; fi
            done
            echo "$2 $3 no rows"
          }
          for i in 1 2 3 4 5 6; do
            rows ../base base $i
            rows . cand $i
          done
