name: vaegram

on: [push]

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - name: aws-lc with only the vault feature
        run: |
          set +e
          cargo tree --locked -e features -i aws-lc-sys --features vault; echo "exit $?"
          cargo tree --locked -e features -i aws-lc-rs --features vault; echo "exit $?"
          cargo tree --locked -e normal,dev --features vault | grep -i "aws-lc" || echo "aws-lc: nothing in the vault-only tree"
      - name: tokio-rustls and rcgen features with only the vault feature
        run: |
          cargo tree --locked -e features -i tokio-rustls --features vault
          cargo tree --locked -e features -i rcgen --features vault
          cargo tree --locked -e features -i rustls --features vault
